name: publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tauri-build:
    strategy:
      matrix:
        platform: ['windows-latest', 'macos-latest', 'ubuntu-24.04']

    runs-on: ${{ matrix.platform }}

    steps:
      # --- ① リポジトリ取得 ---
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- ② Ubuntu 24.04 の依存（Tauri公式準拠） ---
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      # --- ③ Rust のビルドキャッシュ ---
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # --- ④ Rust インストール ---
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # --- ⑤ アイコン生成（Rust-only / 正しいコマンド） ---
      - name: Generate Tauri icons
        run: cargo tauri icon ./icon.png

      # --- ⑥ Rust-only Tauri のビルド ---
      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo build --release

      # --- ⑦ バージョン取得 ---
      - name: Get app version
        run: echo "APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      # --- ⑧ アーティファクトアップロード（OS別） ---
      - name: Upload Windows Portable EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/*.exe

      - name: Upload macOS APP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: src-tauri/target/release/*.app

      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-24.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/*.AppImage

  # --- ⑨ Release 公開 ---
  release:
    needs: tauri-build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
