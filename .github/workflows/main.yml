name: 'publish'

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  tauri-build:
    strategy:
      matrix:
        platform: ['windows-latest', 'macos-latest', 'ubuntu-22.04']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Ubuntu 依存関係（Tauri v2 用）
      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # Node
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # npm install（ルートで実行するのが重要）
      - name: Install dependencies
        run: npm install
        working-directory: ${{ github.workspace }}

      # Rust キャッシュ
      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # アイコンキャッシュ
      - name: Cache Tauri icons
        uses: actions/cache@v4
        with:
          path: src-tauri/icons
          key: ${{ runner.os }}-tauri-icons-${{ hashFiles('icon.png') }}

      # アイコン生成（v2 CLI で OK）
      - name: Generate Tauri icons
        run: npx tauri icon ./icon.png
        working-directory: ${{ github.workspace }}

      # Build（必ずルートで実行）
      - name: Build Tauri app
        run: npx tauri build
        working-directory: ${{ github.workspace }}

      # -----------------------------
      # Windows（Portable EXE）
      # -----------------------------
      - name: Upload Windows Portable EXE
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: src-tauri/target/release/*.exe

      # -----------------------------
      # macOS（DMG / APP）
      # -----------------------------
      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg

      - name: Upload macOS APP
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/macos/app/*.app

      # -----------------------------
      # Linux（AppImage）
      # -----------------------------
      - name: Upload Linux AppImage
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: src-tauri/target/release/bundle/appimage/*.AppImage
