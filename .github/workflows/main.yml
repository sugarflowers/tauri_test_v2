name: Build Tauri App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            artifact-name: 'app-macos'
            args: "--target universal-apple-darwin --no-sign"
          - platform: 'ubuntu-22.04'
            artifact-name: 'app-linux-x86_64'
          - platform: 'ubuntu-24.04-arm'
            artifact-name: 'app-linux-arm64'
          - platform: 'windows-latest'
            artifact-name: 'app-windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # Linux (x86_64 / ARM64) 用のシステム依存関係
      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Windows の場合は --no-bundle を指定してインストーラ作成をスキップ
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ''
          uploadPlainBinary: true
          args: ${{ matrix.platform == 'windows-latest' && '--no-bundle' || '' }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
