name: publish

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  tauri-build:
    strategy:
      matrix:
        platform: ['windows-latest', 'macos-latest', 'ubuntu-24.04']

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2 \
            file

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # ★★★ ここが重要：Rust製 tauri-cli をインストールする ★★★
      - name: Install tauri-cli
        run: cargo install tauri-cli

      # ★★★ 正しいアイコン生成コマンド（Node不要） ★★★
      - name: Generate Tauri icons
        run: tauri icon ./icon.png

      - name: Build Tauri app
        working-directory: src-tauri
        run: cargo build --release

      - name: Get app version
        run: echo "APP_VERSION=$(jq -r .version src-tauri/tauri.conf.json)" >> $GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: src-tauri/target/release/

  release:
    needs: tauri-build
    runs-on: ubuntu-24.04

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Release v${{ env.APP_VERSION }}
          files: artifacts/**
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
