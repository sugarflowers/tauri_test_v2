name: Build Tauri App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            artifact-name: 'app-macos'
          - platform: 'ubuntu-22.04'
            artifact-name: 'app-linux'
          - platform: 'windows-latest'
            artifact-name: 'app-windows'

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Rust ツールチェーンのセットアップ
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # Cargo キャッシュ（ビルド時間の短縮）
      - name: Rust cache
        uses: swatinem/rust-cache@v2

      # Linux の依存関係設定（Tauri v2 用）
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libayatana-appindicator3-dev librsvg2-dev

      # Frontend が Pure Rust の場合は Cargo 経由でビルドを実行
      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        with:
          tagName: ''
          # npm ではなく cargo tauri を使用するように指定
          runner: cargo

      # 生成された成果物を Artifact としてアップロード
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
